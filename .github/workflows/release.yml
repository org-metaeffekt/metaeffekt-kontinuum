name: Create Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version. Must be valid semantic versioning.'
        required: true
        type: string
      ae-workbench-version:
        description: 'Valid workbench branch or version tag.'
        required: true
        default: "main"
        type: string
      ae-core-version:
        description: 'Valid metaeffekt-core version tag.'
        required: true
        type: string
      ae-artifact-analysis-version:
        description: 'Valid metaeffekt-artifact-analysis version tag.'
        required: true
        type: string

env:
  MIRROR_URL: "https://metaeffekt.com/mirror/ae-vulnerability-mirror/ae-mirror-index_gen6-external.tar.gz"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Configure git
        shell: bash
        run: |
          git config --local user.email "github-actions[bot]@metaeffekt.com"
          git config --local user.name "github-actions[bot]"

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Adjust core and artifact-analysis versions
        run: |
          sed -i -E 's|<ae.core.version>[^<]*</ae.core.version>|<ae.core.version>${{ inputs.ae-core-version }}</ae.core.version>|g' \
            processors/_common_/ae-kontinuum-processors.xml
          sed -i -E 's|<ae.artifact.analysis.version>[^<]*</ae.artifact.analysis.version>|<ae.artifact.analysis.version>${{ inputs.ae-artifact-analysis-version }}</ae.artifact.analysis.version>|g' \
            processors/_common_/ae-kontinuum-processors.xml

      - name: Checkout metaeffekt-workbench
        run: |
          git clone https://github.com/org-metaeffekt/metaeffekt-workbench.git ${{ github.workspace }}/.metaeffekt-workbench
          cd ${{ github.workspace }}/.metaeffekt-workbench
          git checkout ${{ inputs.ae-workbench-version }}

      - name: Adjust core and artifact-analysis versions in workbench
        run: |
          cd ${{ github.workspace }}/.metaeffekt-workbench
          sed -i -E 's|<ae.core.version>[^<]*</ae.core.version>|<ae.core.version>${{ inputs.ae-core-version }}</ae.core.version>|' templates/report-template/pom.xml
          sed -i -E 's|<ae.artifact.analysis.version>[^<]*</ae.artifact.analysis.version>|<ae.artifact.analysis.version>${{ inputs.ae-artifact-analysis-version }}</ae.artifact.analysis.version>|' templates/report-template/pom.xml

      - name: Create .local.properties file
        run: |
          umask 077
          touch ${{ github.workspace }}/.local.properties
          echo "ae.workbench.dir=${{ github.workspace }}/.metaeffekt-workbench" >> ${{ github.workspace }}/.local.properties
          echo "vulnerability.mirror.dir=${{ github.workspace }}/.mirror" >> ${{ github.workspace }}/.local.properties
          echo "vulnerability.mirror.url=${{ env.MIRROR_URL }}" >> ${{ github.workspace }}/.local.properties
          echo "nvd.api.key=${{ secrets.NVD_API_KEY }}" >> ${{ github.workspace }}/.local.properties
          echo "ae.core.version=${{ inputs.ae-core-version }}" >> ${{ github.workspace }}/.local.properties
          echo "ae.artifact.analysis.version=${{ inputs.ae-artifact-analysis-version }}" >> ${{ github.workspace }}/.local.properties
          echo "dump.logs=true" >> ${{ github.workspace }}/.local.properties

      - name: Restore vulnerability mirror and maven index cache
        uses: actions/cache/restore@v4
        with:
          key: key-${{ inputs.ae-core-version }}-${{ inputs.ae-artifact-analysis-version }}
          path: |
            .mirror
            .maven-index

      - name: Run test pipelines
        shell: bash
        env:
          AE_CORE_VERSION: ${{ inputs.ae-core-version }}
          AE_ARTIFACT_ANALYSIS_VERSION: ${{ inputs.ae-artifact-analysis-version }}
        run: |          
          ./tests/scripts/pipelines/001_remote.sh

      - name: Save vulnerability mirror and maven index cache
        uses: actions/cache/save@v4
        if: ${{ always() }}
        with:
          key: key-${{ inputs.ae-core-version }}-${{ inputs.ae-artifact-analysis-version }}
          path: |
            .mirror
            .maven-index

      # Commit the overrides on a throwaway commit and publish only the tag, so main is never modified.
      - name: Create release commit and tag
        run: |
          git add processors/_common_/ae-kontinuum-processors.xml
          git commit -m "Release ${{ inputs.version }}" || echo "No changes to commit"
          git tag -f "${{ inputs.version }}"
          # --force allows re-running a failed release; it does not affect main.
          git push --force origin "refs/tags/${{ inputs.version }}"

      - name: Create full source archive
        run: |
          git archive --format=tar.gz \
            --prefix="metaeffekt-kontinuum-${{ inputs.version }}/" \
            --output="metaeffekt-kontinuum-${{ inputs.version }}.tar.gz" \
            "${{ inputs.version }}"

      # This might be broken / might not publish some files in processors/report
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.version }}
          draft: false
          prerelease: false
          files: metaeffekt-kontinuum-${{ inputs.version }}.tar.gz

      # Remove the credential-bearing properties file and pipeline logs so they never leave the runner.
      - name: Clean up local properties and logs
        if: ${{ always() }}
        shell: bash
        run: |
          find "${{ github.workspace }}" -maxdepth 3 -name '.local.properties' -type f -delete
          find "${{ github.workspace }}" -maxdepth 3 -type d -name '.logs' -exec rm -rf {} +